spring.application.name=login-seguranca
server.port=8080

# ---------- Banco de dados H2 em memoria (criado/populado pelo data.sql) ----------
spring.datasource.url=jdbc:h2:mem:segurancadb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.sql.init.mode=always

# ---------- 02 - Observabilidade: Actuator / Prometheus ----------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

info.app.name=@project.name@
info.app.description=@project.description@
info.app.version=@project.version@

# ---------- Regra de bloqueio ----------
# "Caso o usuario falhe mais de uma vez no login ele deve ser bloqueado":
# a partir da 2a falha consecutiva o usuario e bloqueado.
seguranca.max-tentativas=2
